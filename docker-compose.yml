version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: csai-postgres
    environment:
      POSTGRES_USER: csai
      POSTGRES_PASSWORD: csai
      POSTGRES_DB: csai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: csai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
